# Include inside your HTTPS server block after replacing both absolute paths.
# /reading/ and its API must share the same authenticated origin.
location ^~ /reading/api/ {
    auth_basic "Books";
    auth_basic_user_file /etc/books/htpasswd;
    proxy_pass http://127.0.0.1:18004/api/;
    proxy_http_version 1.1;
    # Never forward a user-supplied identity or Basic password to Core.
    proxy_set_header X-Guichao-Home-Authenticated "1";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    client_max_body_size 50m;
}

location /reading/ {
    auth_basic "Books";
    auth_basic_user_file /etc/books/htpasswd;
    alias /opt/books/web/;
    index reader.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
