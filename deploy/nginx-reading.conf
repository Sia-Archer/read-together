location = /reading {
  return 301 /reading/;
}

location = /_guichao_reading_home_auth {
  internal;
  proxy_pass http://127.0.0.1:8787/api/appearance;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Host $host;
}

# Home can read this only through the loopback service. Never publish it.
location = /reading/api/presence {
  return 404;
}

location /reading/api/ {
  auth_basic off;
  auth_request /_guichao_reading_home_auth;
  proxy_pass http://127.0.0.1:18004/api/;
  proxy_http_version 1.1;
  proxy_set_header X-Guichao-Home-Authenticated "1";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 75s;
  client_max_body_size 50m;
}

location = /reading/sw.js {
  auth_basic off;
  alias /opt/books/web/sw.js;
  default_type application/javascript;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /reading/manifest.webmanifest {
  return 410;
}

location /reading/ {
  auth_basic off;
  auth_request /_guichao_reading_home_auth;
  error_page 401 =302 /login.html;
  alias /opt/books/web/;
  index reader.html;
  try_files $uri $uri/ /reading/reader.html;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
}
