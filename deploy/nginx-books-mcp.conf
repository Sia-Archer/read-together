# Include in the same HTTPS server as nginx-standalone.conf. Replace the
# password-file path and adapter address if your deployment differs.
# The authorization page must authenticate the owner before issuing a code.
location = /books-mcp/oauth/authorize {
    auth_basic "Books";
    auth_basic_user_file /etc/books/htpasswd;
    proxy_pass http://127.0.0.1:18006/oauth/authorize;
    proxy_http_version 1.1;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# RFC 8414 and RFC 9728 discovery for the path-based issuer and resource.
location = /.well-known/oauth-authorization-server/books-mcp {
    auth_basic off;
    proxy_pass http://127.0.0.1:18006/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource/books-mcp/mcp {
    auth_basic off;
    proxy_pass http://127.0.0.1:18006/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The trailing slash removes /books-mcp/ before forwarding to the adapter.
location /books-mcp/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18006/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}
