<div class="sheet" id="sheet-set" aria-label="阅读设置">
  <div class="settings-grabber" aria-hidden="true"></div>
  <div class="settings-head">
    <h2>阅读设置</h2>
    <button class="settings-close" id="settings-close" type="button" aria-label="关闭阅读设置">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <section class="settings-section">
    <div class="settings-label">主题</div>
    <div class="theme-grid" id="theme-seg">
      <button class="theme-choice theme-yellow" type="button" data-t="yellow"><span class="theme-dots"><i></i><i></i><i></i></span><span>日记</span></button>
      <button class="theme-choice theme-pink" type="button" data-t="pink"><span class="theme-dots"><i></i><i></i><i></i></span><span>淡粉</span></button>
      <button class="theme-choice theme-night" type="button" data-t="night"><span class="theme-dots"><i></i><i></i><i></i></span><span>夜间</span></button>
    </div>
  </section>
  <section class="settings-section">
    <div class="settings-label">字体</div>
    <div class="type-preview" id="type-preview">读到这一页，刚好想起你。</div>
    <div id="typography-controls">
      <div class="step-row"><span class="step-label">字号</span><div class="stepper"><button type="button" data-setting="fontSize" data-delta="-1" aria-label="减小字号"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><output id="fs-val"></output><button type="button" data-setting="fontSize" data-delta="1" aria-label="增大字号"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div></div>
      <div class="step-row"><span class="step-label">行距</span><div class="stepper"><button type="button" data-setting="lineHeight" data-delta="-0.1" aria-label="减小行距"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><output id="lh-val"></output><button type="button" data-setting="lineHeight" data-delta="0.1" aria-label="增大行距"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div></div>
    </div>
  </section>
  <section class="settings-section page-mode-section">
    <div class="page-mode-label">翻页</div>
    <div class="page-mode" id="page-mode">
      <button type="button" data-mode="swipe">左右滑动</button>
      <button type="button" data-mode="tap">两侧点按</button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet-toc">
  <div class="toc-head">目录</div>
  <div class="toc-list" id="toc-list"></div>
</div>

<div class="sheet" id="sheet-library">
  <div class="toc-head">书签与批注</div>
  <div class="library-seg" id="library-seg" role="tablist" aria-label="书签与批注">
    <button class="on" type="button" data-library-tab="bookmarks" role="tab">书签</button>
    <button type="button" data-library-tab="annotations" role="tab">批注</button>
  </div>
  <div class="panel-list" id="library-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/reading/api';
const HOME_HOSTED = document.documentElement.dataset.homeHosted === '1';
const reader = document.getElementById('reader');
const rFlow = document.getElementById('r-flow');
const rViewport = document.getElementById('r-viewport');
const rFoot = document.getElementById('r-foot');
const rTitle = document.getElementById('r-title');
const sheet = document.getElementById('sheet');
const sheetMask = document.getElementById('sheet-mask');
if (HOME_HOSTED && window.parent !== window) {
  new MutationObserver(() => window.parent.postMessage({
    type: 'guichao-books:sheet', open: sheetMask.classList.contains('open'), mask: getComputedStyle(sheetMask).backgroundColor
  }, location.origin)).observe(sheetMask, { attributes: true, attributeFilter: ['class'] });
}
const selectionTools = document.getElementById('selection-tools');
const toastEl = document.getElementById('toast');
const shelfEl = document.getElementById('shelf');
const shelfStage = document.getElementById('shelf-stage');
const shelfDots = document.getElementById('shelf-dots');

const R = {
  books: [], book: null, manifest: null, chapters: {}, annos: [], marks: [],
  ch: 0, page: 0, pages: 1, paraPages: [], step: 0,
  beatTimer: null, sessionOpen: false,
  pendingSel: null, selectionBusy: false, suppressReaderClickUntil: 0,
  sheetMode: null, detailAnno: null, detailPollTimer: null, detailPollUntil: 0,
  replyDelivery: null, libraryTab: 'bookmarks',
};

const People = {
  human: { name: '读者', avatarUrl: HOME_HOSTED ? '/assets/human-avatar.jpg' : (globalThis.__BOOKS_HOST_AVATARS__?.human || ''), fallback: '读' },
  companion: { name: '共读者', avatarUrl: HOME_HOSTED ? '/assets/companion-avatar.jpg' : (globalThis.__BOOKS_HOST_AVATARS__?.companion || ''), fallback: '伴' },
};

const Shelf = {
  active: 0, cards: [], dots: [], pointerId: null,
  startX: 0, startY: 0, dragX: 0, axis: null, moved: false,
  noteRequest: 0,
};

const ReaderGesture = {
  active: false, horizontal: false, cancelled: false,
  startX: 0, startY: 0, lastX: 0, startedAt: 0,
};
// 触屏上用荧光笔涂抹代替系统选字；不支持 CSS 自定义高亮的浏览器保留系统选字。
const PaintSelect = {
  enabled: Boolean(globalThis.CSS?.highlights && globalThis.Highlight) && matchMedia('(hover: none) and (pointer: coarse)').matches,
  timer: 0, startX: 0, startY: 0, active: false, paraIdx: -1, anchorOff: 0, focusOff: 0, range: null,
};
if (PaintSelect.enabled) document.documentElement.classList.add('paint-select');

/* ── 阅读设置（按设备记忆） ── */
const SET_KEY = 'readalong-settings';
const settings = Object.assign(
  { fontSize: 17, lineHeight: 1.9, theme: 'pink', pageMode: 'tap' },
  (() => { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch { return {}; } })()
);
if (!['yellow', 'pink', 'night'].includes(settings.theme)) settings.theme = settings.theme === 'dark' ? 'night' : 'yellow';
if (!['swipe', 'tap'].includes(settings.pageMode)) settings.pageMode = 'tap';
function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch {} }

function applyTheme() {
  document.documentElement.dataset.theme = settings.theme;
  const colors = getComputedStyle(document.documentElement);
  const theme = { bg: colors.getPropertyValue('--bg').trim(), ink: colors.getPropertyValue('--text').trim() };
  document.querySelector('meta[name="theme-color"]').content = theme.bg;
  document.getElementById('theme-seg').style.setProperty('--theme-position', { yellow: '0%', pink: '100%', night: '200%' }[settings.theme]);
  document.querySelectorAll('#theme-seg button').forEach((b) => b.classList.toggle('on', b.dataset.t === settings.theme));
  if (HOME_HOSTED && window.parent !== window) {
    window.parent.postMessage({ type: 'guichao-books:theme', bg: theme.bg, ink: theme.ink }, location.origin);
  }
}

function applyTypography() {
  rFlow.style.fontSize = settings.fontSize + 'px';
  rFlow.style.lineHeight = String(settings.lineHeight);
  document.getElementById('fs-val').textContent = settings.fontSize;
  document.getElementById('lh-val').textContent = Number(settings.lineHeight).toFixed(1);
  const preview = document.getElementById('type-preview');
  preview.style.fontSize = settings.fontSize + 'px';
  preview.style.lineHeight = String(settings.lineHeight);
}

function applyPageMode() {
  document.getElementById('page-mode').style.setProperty('--page-mode-position', settings.pageMode === 'tap' ? '100%' : '0%');
  document.querySelectorAll('#page-mode button').forEach((button) => {
    const active = button.dataset.mode === settings.pageMode;
    button.classList.toggle('on', active);
    button.setAttribute('aria-pressed', String(active));
  });
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function returnToHomeLogin() {
  try { window.top.location.assign('/login.html'); }
  catch { location.assign('/login.html'); }
}

async function decodeResponse(r) {
  const json = await r.json().catch(() => ({}));
  if (r.status === 401) {
    returnToHomeLogin();
    throw new Error('小家登录已过期');
  }
  if (!r.ok) throw new Error(json.error || r.status);
  return json;
}

async function apiGet(path) {
  return decodeResponse(await fetch(API + path, { cache: 'no-store' }));
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    keepalive: true,
  });
  return decodeResponse(r);
}

async function apiDelete(path) {
  const r = await fetch(API + path, { method: 'DELETE' });
  return decodeResponse(r);
}

function coverUrl(book) {
  return book && book.hasCover ? `${API}/cover/${book.bookId}` : '';
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function companionLabel(item, fallback = '共读者') {
  if (item?.author === 'ai' || item?.createdBy === 'ai') return People.companion.name;
  return fallback;
}

function personFor(item, author = item?.author || item?.createdBy) {
  if (author === 'human' || author === 'human') return People.human;
  return People.companion;
}

function avatarHtml(person, side = '') {
  const src = String(person?.avatarUrl || '').trim();
  return `<div class="thread-avatar ${esc(side)}"><span>${esc(person?.fallback || '')}</span>${src ? `<img src="${esc(src)}" alt="" onerror="this.style.display='none'">` : ''}</div>`;
}

function personNameClass(person) {
  if (person === People.human) return 'name-human';
  return 'name-companion';
}

function fmtThreadTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} · ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtDur(ms) {
  const minutes = Math.round((ms || 0) / 60000);
  if (minutes < 60) return `${minutes}分钟`;
  return `${Math.floor(minutes / 60)}小时${minutes % 60}分`;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtAgo(iso) {
  if (!iso) return '';
  const elapsed = Math.max(0, Date.now() - new Date(iso).getTime());
  if (!Number.isFinite(elapsed)) return '';
  const minutes = Math.floor(elapsed / 60000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes}分钟前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}小时前`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days}天前`;
  return fmtTime(iso).slice(0, 5);
}

function readerProgressText(summary, fallbackLabel) {
  const label = summary?.label || fallbackLabel;
  if (!summary?.lastReadAt) return `${label} · 未开始`;
  return `${label} · ${Math.max(0, Math.round(Number(summary.progressPct) || 0))}% · ${fmtAgo(summary.lastReadAt)}`;
}

/* ── 书架 ── */

function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

function cardTransform(position) {
  const abs = Math.abs(position);
  const x = position * 132;
  const z = Math.max(-150, 28 - abs * 84);
  const scale = Math.max(.68, 1 - abs * .16);
  const rotate = clamp(position * -34, -48, 48);
  return `translate3d(calc(-50% + ${x}px), ${abs * 10}px, ${z}px) rotateY(${rotate}deg) scale(${scale})`;
}

function renderShelfCards(offset = 0) {
  Shelf.cards.forEach((card, index) => {
    const position = index - Shelf.active + offset;
    const abs = Math.abs(position);
    card.style.transform = cardTransform(position);
    card.style.opacity = abs > 2.2 ? '0' : String(Math.max(.28, 1 - abs * .26));
    card.style.filter = abs < .35 ? 'none' : `saturate(${Math.max(.42, 1 - abs * .2)}) brightness(${Math.max(.82, 1 - abs * .07)})`;
    card.style.zIndex = String(20 - Math.round(abs * 4));
    card.classList.toggle('is-active', index === Shelf.active && Math.abs(offset) < .2);
    card.setAttribute('aria-hidden', abs > 2.2 ? 'true' : 'false');
    card.tabIndex = index === Shelf.active ? 0 : -1;
  });
}

function activeShelfBook() { return R.books[Shelf.active] || null; }

function renderHomeNote(book, annotation, total = 0) {
  const content = document.getElementById('home-note-content');
  document.getElementById('home-notes-title').textContent = '最近批注';
  document.getElementById('home-notes-all').textContent = total > 0 ? `查看全部 · ${total}` : '查看全部';
  if (!annotation) {
    content.innerHTML = '<div class="empty-note">这一页还安静着</div>';
    return;
  }
  const root = annotationRoot(annotation);
  content.innerHTML = `<article class="note-card" data-id="${esc(annotation.id)}"><p class="home-quote">${esc(annotation.quote)}</p><p class="note-meta"><span>${annotation.createdBy === 'human' ? '我' : companionLabel(annotation)}</span><span>${fmtTime(annoLastAt(annotation))}</span><span>${root.replies.length}条回复</span></p></article>`;
}

async function renderShelfContent() {
  const book = activeShelfBook();
  if (!book) return;
  document.getElementById('home-title').textContent = book.title;
  document.getElementById('home-author').textContent = book.author || '';
  const progress = Number(book.progressPct) || 0;
  document.getElementById('home-progress-text').textContent = progress ? `已读 ${progress}%` : '未开始';
  document.getElementById('home-progress-bar').style.width = `${progress}%`;
  document.getElementById('home-progress-human').textContent = readerProgressText(book.readers?.human, '读者');
  document.getElementById('home-progress-ai').textContent = readerProgressText(book.readers?.ai, '共读者');
  document.getElementById('home-read-time').textContent = book.totalReadMs ? `共读 ${fmtDur(book.totalReadMs)}` : '等你翻开';
  document.getElementById('home-read-btn').textContent = progress ? '继续阅读' : '开始阅读';
  document.getElementById('home-read-btn').disabled = false;
  Shelf.dots.forEach((dot, index) => dot.classList.toggle('on', index === Shelf.active));
  const request = ++Shelf.noteRequest;
  document.getElementById('home-note-content').innerHTML = '<div class="empty-note">正在整理书页…</div>';
  try {
    const { annotations } = await apiGet('/annotations/' + book.bookId);
    if (request !== Shelf.noteRequest || activeShelfBook()?.bookId !== book.bookId) return;
    const annotated = annotations.filter((item) => annotationRoot(item).text);
    const latest = annotated.slice().sort((a, b) => annoLastAt(b).localeCompare(annoLastAt(a)))[0];
    renderHomeNote(book, latest, annotated.length);
  } catch (e) {
    if (request === Shelf.noteRequest && !loginScreen.classList.contains('hidden')) return;
    if (request === Shelf.noteRequest) renderHomeNote(book, null);
  }
}

function selectShelf(index) {
  if (!R.books.length) return;
  Shelf.active = clamp(index, 0, R.books.length - 1);
  renderShelfCards();
  renderShelfContent();
}

function buildShelf(books) {
  shelfStage.innerHTML = '';
  shelfDots.innerHTML = '';
  Shelf.cards = books.map((book, index) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'shelf-book';
    card.setAttribute('aria-label', `选择《${book.title}》`);
    const cover = coverUrl(book);
    card.innerHTML = `<span class="book-shell">${cover ? `<img src="${esc(cover)}" alt="《${esc(book.title)}》封面" draggable="false">` : `<span class="book-placeholder">${esc(book.title)}</span>`}</span>`;
    card.addEventListener('click', () => {
      if (Shelf.moved) return;
      if (index !== Shelf.active) selectShelf(index);
      else if (document.documentElement.dataset.library === '1' && window.parent !== window) {
        window.parent.postMessage({ type: 'guichao-books:book-detail', bookId: book.bookId }, location.origin);
      }
    });
    shelfStage.appendChild(card);
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'page-dot';
    dot.setAttribute('aria-label', `第 ${index + 1} 本书`);
    dot.addEventListener('click', () => selectShelf(index));
    shelfDots.appendChild(dot);
    Shelf.dots.push(dot);
    return card;
  });
  selectShelf(0);
}

async function loadShelf() {
  try {
    const { books } = await apiGet('/books');
    const ids = new URLSearchParams(location.search).get('ids');
    const allowed = ids === null ? null : new Set(ids.split(',').filter(Boolean));
    R.books = books.filter(book => !book.removed && (!allowed || allowed.has(book.bookId))).sort((a, b) => String(b.lastOpenedAt || '').localeCompare(String(a.lastOpenedAt || '')));
    Shelf.dots = [];
    if (!R.books.length) {
      shelfStage.innerHTML = '<div class="shelf-empty">书房还空着。<br>点右上角“导入”，把第一本书放进来。</div>';
      shelfDots.innerHTML = '';
      document.getElementById('home-title').textContent = '等一本书来';
      document.getElementById('home-author').textContent = '';
      document.getElementById('home-progress-text').textContent = '未开始';
      document.getElementById('home-progress-bar').style.width = '0%';
      document.getElementById('home-progress-human').textContent = '读者 · 未开始';
      document.getElementById('home-progress-ai').textContent = '共读者 · 未开始';
      document.getElementById('home-read-time').textContent = '书页会在这里醒来';
      document.getElementById('home-read-btn').disabled = true;
      renderHomeNote(null, null);
      return;
    }
    document.getElementById('home-read-btn').disabled = false;
    buildShelf(R.books);
  } catch (e) {
    shelfStage.innerHTML = '<div class="shelf-empty">书页暂时没有翻开。<br>' + esc(e.message) + '</div>';
  }
}

shelfStage.addEventListener('pointerdown', (event) => {
  if (Shelf.pointerId !== null || !R.books.length) return;
  Shelf.pointerId = event.pointerId; Shelf.startX = event.clientX; Shelf.startY = event.clientY;
  Shelf.dragX = 0; Shelf.axis = null; Shelf.moved = false;
});
shelfStage.addEventListener('pointermove', (event) => {
  if (event.pointerId !== Shelf.pointerId) return;
  const dx = event.clientX - Shelf.startX; const dy = event.clientY - Shelf.startY;
  if (!Shelf.axis && Math.max(Math.abs(dx), Math.abs(dy)) > 7) {
    Shelf.axis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
    if (Shelf.axis === 'horizontal') {
      shelfStage.setPointerCapture(event.pointerId);
      shelfStage.classList.add('dragging');
    }
  }
  if (Shelf.axis !== 'horizontal') return;
  Shelf.moved = Math.abs(dx) > 8; Shelf.dragX = dx;
  const resisted = (Shelf.active === 0 && dx > 0) || (Shelf.active === R.books.length - 1 && dx < 0) ? dx * .34 : dx;
  renderShelfCards(resisted / 132);
});
function finishShelfPointer(event) {
  if (event.pointerId !== Shelf.pointerId) return;
  shelfStage.classList.remove('dragging');
  if (Shelf.axis === 'horizontal' && Math.abs(Shelf.dragX) > 42) Shelf.active = clamp(Shelf.active + (Shelf.dragX < 0 ? 1 : -1), 0, R.books.length - 1);
  Shelf.pointerId = null; Shelf.axis = null; renderShelfCards(); renderShelfContent(); setTimeout(() => { Shelf.moved = false; }, 0);
}
shelfStage.addEventListener('pointerup', finishShelfPointer);
shelfStage.addEventListener('pointercancel', finishShelfPointer);
shelfStage.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') selectShelf(Shelf.active + 1);
  if (event.key === 'ArrowLeft') selectShelf(Shelf.active - 1);
});

document.getElementById('home-read-btn').addEventListener('click', async () => {
  const book = activeShelfBook(); if (!book) return;
  await openBookDirect(book.bookId);
});
document.getElementById('home-notes-all').addEventListener('click', async () => {
  const book = activeShelfBook(); if (!book) return;
  if (await loadBookData(book.bookId)) openLibrarySheet('annotations');
});
document.getElementById('home-note-content').addEventListener('click', async (event) => {
  const item = event.target.closest('.note-card');
  const book = activeShelfBook();
  if (!item || !book || !(await loadBookData(book.bookId))) return;
  const anno = R.annos.find((entry) => entry.id === item.dataset.id);
  if (anno) openSheet('detail', anno, { jump: true });
});

/* ── 书房入口 ── */

document.getElementById('stats-btn').addEventListener('click', () => {
  if (HOME_HOSTED && window.parent !== window) {
    window.parent.postMessage({ type: 'guichao-books:stats' }, location.origin);
    return;
  }
  location.assign('/reading/stats.html');
});

window.addEventListener('message', (event) => {
  if (!HOME_HOSTED || event.origin !== location.origin || event.source !== window.parent) return;
  if (event.data?.type === 'guichao-books:sheet-close') closeSheet();
  if (event.data?.type === 'guichao-books:host-ready') {
    applyTheme();
    window.parent.postMessage({ type: 'guichao-books:view', view: reader.classList.contains('open') ? 'reader' : 'shelf' }, location.origin);
  }
  if (event.data?.type === 'guichao-books:import') document.getElementById('imp-file').click();
  if (event.data?.type === 'guichao-books:people') {
    ['human', 'companion'].forEach((key) => {
      const incoming = event.data.people?.[key];
      if (!incoming) return;
      if (incoming.name) People[key].name = String(incoming.name);
      if (incoming.avatarUrl) People[key].avatarUrl = String(incoming.avatarUrl);
    });
    if (R.detailAnno && sheet.classList.contains('open')) renderComments(R.detailAnno);
  }
});
if (HOME_HOSTED && window.parent !== window) {
  window.parent.postMessage({ type: 'guichao-books:people-request' }, location.origin);
}

document.getElementById('imp-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast(`《${file.name}》导入中…`);
  try {
    const r = await fetch(`${API}/import?filename=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
    const json = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(json.error || r.status);
    toast(`《${json.book.title}》导入好了，共${json.book.chapterCount}章`);
    loadShelf();
  } catch (err) {
    toast('导入失败：' + err.message);
  }
});

/* ── 书籍数据与首页直达 ── */

async function loadBookData(bookId) {
  const book = R.books.find((b) => b.bookId === bookId);
  if (!book) return false;
  if (!R.book || R.book.bookId !== bookId) R.chapters = {};
  R.book = book;
  try {
    const [detail, annos, marks] = await Promise.all([
      apiGet('/book/' + bookId),
      apiGet('/annotations/' + bookId),
      apiGet('/bookmarks/' + bookId),
    ]);
    R.manifest = detail.manifest;
    R.marks = marks.bookmarks;
    R.book.lastPos = detail.lastPos;
    R.book.progressPct = detail.progressPct;
    R.book.lastOpenedAt = detail.lastOpenedAt;
    R.book.readers = detail.readers;
    R.book.totalReadMs = detail.totalReadMs;
    R.annos = annos.annotations;
    return true;
  } catch (e) {
    toast('加载失败：' + e.message);
    return false;
  }
}

async function openBookDirect(bookId) {
  if (!(await loadBookData(bookId))) return;
  const pos = R.book.lastPos;
  await enterReader(pos && Number.isInteger(pos.chapter) ? pos.chapter : 0, pos ? pos.seqTop : 0);
}

function annoLastAt(a) {
  const comments = Array.isArray(a.comments) ? a.comments : [];
  return comments.length ? comments[comments.length - 1].createdAt : a.createdAt;
}

function selectionKey(annotation) {
  if (!Number.isInteger(annotation?.seq) || !Number.isInteger(annotation?.startOff) || !Number.isInteger(annotation?.endOff)) return `id:${annotation.id}`;
  return `${annotation.seq}:${annotation.startOff}:${annotation.endOff}`;
}

function selectionGroup(annotation) {
  const key = selectionKey(annotation);
  return R.annos.filter((item) => selectionKey(item) === key).sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
}

function annotationRoot(annotation) {
  const comments = Array.isArray(annotation.comments) ? annotation.comments : [];
  const text = String(annotation.note || annotation.comment || '').trim();
  const first = comments[0];
  if (!text && first?.author === annotation.createdBy && first.kind !== 'reply') {
    return { text: String(first.text || '').trim(), at: first.createdAt || annotation.createdAt, replies: comments.slice(1) };
  }
  return { text, at: annotation.createdAt, replies: comments };
}

const libraryScrollPositions = new Map();
let displayedLibraryKey = null;
function renderLibrarySheet(tab = R.libraryTab || 'bookmarks') {
  const list = document.getElementById('library-list');
  if (displayedLibraryKey) libraryScrollPositions.set(displayedLibraryKey, list.scrollTop);
  R.libraryTab = tab === 'annotations' ? 'annotations' : 'bookmarks';
  document.querySelectorAll('#library-seg button').forEach((button) => {
    const active = button.dataset.libraryTab === R.libraryTab;
    button.classList.toggle('on', active);
    button.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  displayedLibraryKey = `${R.book.bookId}:${R.libraryTab}`;
  document.getElementById('library-seg').dataset.selected = R.libraryTab;
  const restoreScroll = () => { list.scrollTop = libraryScrollPositions.get(displayedLibraryKey) || 0; };
  if (R.libraryTab === 'annotations') {
    const grouped = new Map();
    for (const annotation of R.annos) {
      const key = selectionKey(annotation);
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(annotation);
    }
    const groups = [...grouped.values()].sort((a, b) =>
      Math.max(...b.map(item => Date.parse(annoLastAt(item)) || 0)) - Math.max(...a.map(item => Date.parse(annoLastAt(item)) || 0)));
    list.innerHTML = groups.length ? groups.map((group) => {
      const first = group[0];
      const authors = [...new Set(group.map(annotation => annotation.createdBy))];
      const lastAt = group.map(annoLastAt).sort().at(-1);
      const replies = group.reduce((count, annotation) => count + annotationRoot(annotation).replies.length, 0);
      return `<div class="anno-item" data-id="${esc(first.id)}">
        <div class="anno-quote">${esc(first.quote)}</div>
        <div class="anno-sub">${authors.map(author => `<span class="who-${esc(author)}">${author === 'human' ? '我' : esc(personFor(null, author).name)}</span>`).join('')}<span>${fmtTime(lastAt)}</span><span>${replies}条</span></div>
      </div>`;
    }).join('') : '<div class="empty-tip">还没有批注，读起来吧</div>';
    restoreScroll();
    return;
  }
  const marks = R.marks.slice().sort((a, b) => a.seq - b.seq);
  list.innerHTML = marks.length ? marks.map((mark) =>
    `<button class="mark-item" type="button" data-id="${esc(mark.id)}">
      <div class="mark-excerpt">${esc(mark.excerpt || '这一页')}</div>
      <div class="mark-sub"><span>${esc(mark.chapterTitle || `第 ${Number(mark.chapter) + 1} 章`)}</span><span>${fmtTime(mark.createdAt)}</span></div>
    </button>`
  ).join('') : '<div class="empty-tip">还没有书签，读到想停的地方再夹一枚</div>';
  restoreScroll();
}

function openLibrarySheet(tab = R.libraryTab || 'bookmarks') {
  renderLibrarySheet(tab);
  openSheetEl(document.getElementById('sheet-library'));
}

document.getElementById('library-seg').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-library-tab]');
  if (button) renderLibrarySheet(button.dataset.libraryTab);
});

document.getElementById('library-list').addEventListener('click', async (event) => {
  const annoItem = event.target.closest('.anno-item');
  if (annoItem) {
    const anno = R.annos.find((entry) => entry.id === annoItem.dataset.id);
    if (anno) { closeSheet(); openSheet('detail', anno, { jump: true }); }
    return;
  }
  const markItem = event.target.closest('.mark-item');
  if (!markItem) return;
  const mark = R.marks.find((entry) => entry.id === markItem.dataset.id);
  if (!mark) return;
  closeSheet();
  await enterReader(Number(mark.chapter) || 0, mark.seq);
});

/* ── 阅读器：加载与分页 ── */

async function loadChapter(idx) {
  if (!R.chapters[idx]) R.chapters[idx] = await apiGet(`/book/${R.book.bookId}/chapter/${idx}`);
  return R.chapters[idx];
}

async function enterReader(chIdx, seq) {
  closeSheet();
  document.body.classList.add('reader-open');
  reader.classList.add('open');
  if (HOME_HOSTED && window.parent !== window) window.parent.postMessage({ type: 'guichao-books:view', view: 'reader' }, location.origin);
  if (!R.sessionOpen) {
    R.sessionOpen = true;
    sendBeat('open');
  }
  await showChapter(chIdx, seq);
  startBeats();
}

async function showChapter(chIdx, seq) {
  clearNativeSelection();
  let ch;
  try {
    ch = await loadChapter(chIdx);
  } catch { toast('章节加载失败'); return; }
  R.ch = chIdx;
  rTitle.textContent = R.book.title;
  rFlow.classList.add('no-transition');
  renderChapterHtml(ch);
  paginate();
  let page = 0;
  if (Number.isInteger(seq)) {
    const paraIdx = Math.max(0, Math.min(ch.paragraphs.length - 1, seq - ch.baseSeq));
    page = R.paraPages[paraIdx] ? R.paraPages[paraIdx].start : 0;
  }
  gotoPage(page, { silentIfSame: false });
  requestAnimationFrame(() => rFlow.classList.remove('no-transition'));
}

function renderChapterHtml(ch) {
  const annosByPara = {};
  for (const a of R.annos) {
    const paraIdx = a.seq - ch.baseSeq;
    if (paraIdx >= 0 && paraIdx < ch.paragraphs.length) {
      (annosByPara[paraIdx] = annosByPara[paraIdx] || []).push(a);
    }
  }
  rFlow.innerHTML = ch.paragraphs.map((text, i) => {
    const cls = i === 0 && text === ch.title ? ' class="is-title"' : '';
    return `<p data-i="${i}"${cls}>${renderParaHtml(text, annosByPara[i] || [])}</p>`;
  }).join('');
}

function renderParaHtml(text, annos) {
  if (!annos.length) return esc(text);
  const bounds = new Set([0, text.length]);
  for (const a of annos) {
    bounds.add(Math.max(0, Math.min(text.length, a.startOff)));
    bounds.add(Math.max(0, Math.min(text.length, a.endOff)));
  }
  const points = [...bounds].sort((x, y) => x - y);
  let html = '';
  for (let k = 0; k < points.length - 1; k += 1) {
    const [s, e] = [points[k], points[k + 1]];
    if (e <= s) continue;
    const covering = annos.filter((a) => a.startOff <= s && a.endOff >= e);
    const segText = esc(text.slice(s, e));
    if (!covering.length) {
      html += segText;
    } else {
      const first = covering.slice().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')))[0];
      const cls = `hl-${first.createdBy}${covering.some((a) => annotationRoot(a).text) ? ' has-note' : ''}`;
      html += `<span class="seg ${cls}" data-ids="${covering.map((a) => a.id).join(',')}">${segText}</span>`;
    }
    const shownBubbles = new Set();
    for (const a of annos) {
      const key = `${a.startOff}:${a.endOff}`;
      if (a.endOff === e && a.id !== 'preview' && !shownBubbles.has(key)) {
        const creators = annos.filter((item) => item.id !== 'preview' && item.startOff === a.startOff && item.endOff === a.endOff)
          .sort((left, right) => String(left.createdAt || '').localeCompare(String(right.createdAt || '')));
        const shownCreators = new Set();
        for (const item of creators) {
          if (shownCreators.has(item.createdBy)) continue;
          html += `<span class="bub by-${item.createdBy}" data-id="${item.id}"></span>`;
          shownCreators.add(item.createdBy);
        }
        shownBubbles.add(key);
      }
    }
  }
  return html;
}

function paginate() {
  const w = rViewport.clientWidth - 44; /* padding 22*2 */
  const gap = 44;
  R.step = w + gap;
  rFlow.style.transform = 'none';
  rFlow.style.columnWidth = w + 'px';
  const flowLeft = rFlow.getBoundingClientRect().left;
  R.pages = Math.max(1, Math.ceil((rFlow.scrollWidth - 1) / R.step));
  R.paraPages = [];
  rFlow.querySelectorAll('p').forEach((p) => {
    const rects = p.getClientRects();
    if (!rects.length) { R.paraPages.push({ start: 0, end: 0 }); return; }
    const start = Math.round((rects[0].left - flowLeft) / R.step);
    const end = Math.round((rects[rects.length - 1].left - flowLeft) / R.step);
    R.paraPages.push({ start, end });
  });
}

function currentParaRange() {
  const ch = R.chapters[R.ch];
  let first = null;
  let last = null;
  R.paraPages.forEach((pp, i) => {
    if (pp.start <= R.page && pp.end >= R.page) {
      if (first === null) first = i;
      last = i;
    }
  });
  if (first === null) return null;
  return { seqStart: ch.baseSeq + first, seqEnd: ch.baseSeq + last };
}

function gotoPage(page, { silentIfSame = true } = {}) {
  const clamped = Math.max(0, Math.min(R.pages - 1, page));
  if (silentIfSame && clamped === R.page) return;
  R.page = clamped;
  rFlow.style.transform = `translateX(${-clamped * R.step}px)`;
  const ch = R.chapters[R.ch];
  const range = currentParaRange();
  const progress = range ? Math.round(((range.seqStart + 1) / R.manifest.paraCount) * 1000) / 10 : 0;
  rFoot.textContent = `${clamped + 1}/${R.pages} · ${ch.title} · ${progress}%`;
  updateMarkBtn();
  if (range) sendBeat('page', range);
}

async function turnPage(dir) {
  clearNativeSelection();
  const next = R.page + dir;
  if (next >= R.pages && R.ch < R.manifest.chapterCount - 1) {
    await showChapter(R.ch + 1, null);
    return;
  }
  if (next < 0 && R.ch > 0) {
    await showChapter(R.ch - 1, null);
    gotoPage(R.pages - 1, { silentIfSame: false });
    return;
  }
  gotoPage(next);
}

/* ── 心跳 ── */

function beatPayload(event) {
  const range = currentParaRange() || {};
  return {
    bookId: R.book.bookId,
    event,
    chapter: R.ch,
    seqStart: range.seqStart,
    seqEnd: range.seqEnd,
    pageKey: `c${R.ch}p${R.page}`,
  };
}

function sendBeat(event, range) {
  if (!R.book) return;
  const payload = event === 'open' || event === 'close'
    ? { bookId: R.book.bookId, event }
    : beatPayload(event);
  if (range) Object.assign(payload, range);
  apiPost('/beat', payload).catch(() => {});
}

function startBeats() {
  stopBeats();
  R.beatTimer = setInterval(() => {
    if (!document.hidden && reader.classList.contains('open')) sendBeat('beat');
  }, 10000);
}

function stopBeats() {
  if (R.beatTimer) clearInterval(R.beatTimer);
  R.beatTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && R.sessionOpen && R.book) {
    navigator.sendBeacon(API + '/beat', new Blob([JSON.stringify(beatPayload('beat'))], { type: 'application/json' }));
  }
});

function exitReader() {
  if (R.sessionOpen) {
    sendBeat('close');
    R.sessionOpen = false;
  }
  stopBeats();
  clearNativeSelection();
  closeBar();
  reader.classList.remove('open');
  document.body.classList.remove('reader-open');
  if (HOME_HOSTED && window.parent !== window) window.parent.postMessage({ type: 'guichao-books:view', view: 'shelf' }, location.origin);
  renderShelfContent();
}

/* ── 书签 ── */

function pageMark() {
  const range = currentParaRange();
  if (!range) return null;
  return R.marks.find((mk) => mk.seq >= range.seqStart && mk.seq <= range.seqEnd) || null;
}

function updateMarkBtn() {
  const button = document.getElementById('r-mark');
  const active = Boolean(pageMark());
  button.classList.toggle('on', active);
  document.getElementById('reader-page-bookmark').hidden = !active;
  button.setAttribute('aria-pressed', String(active));
  button.setAttribute('aria-label', active ? '取下书签' : '夹上书签');
}

async function toggleBookmark() {
  const range = currentParaRange();
  if (!range) return;
  const existing = pageMark();
  try {
    if (existing) {
      await apiDelete(`/bookmarks/${R.book.bookId}/${existing.id}`);
      R.marks = R.marks.filter((mk) => mk.id !== existing.id);
      toast('书签已取下');
    } else {
      const { bookmark } = await apiPost('/bookmarks', { bookId: R.book.bookId, seq: range.seqStart });
      R.marks.push(bookmark);
      R.marks.sort((a, b) => a.seq - b.seq);
      toast('书签夹好了');
    }
    updateMarkBtn();
    document.getElementById('rb-library-count').textContent = `${R.marks.length} 书签 · ${R.annos.length} 批注`;
    const button = document.getElementById('r-mark');
    button.classList.remove('pulse');
    void button.offsetWidth;
    button.classList.add('pulse');
    window.setTimeout(() => button.classList.remove('pulse'), 380);
  } catch (e) {
    toast('书签失败：' + e.message);
  }
}

/* ── 阅读器点击：翻页 / 原生划线 ── */

function openBar() {
  const range = currentParaRange();
  const progress = range && R.manifest && R.manifest.paraCount
    ? Math.round(((range.seqStart + 1) / R.manifest.paraCount) * 1000) / 10
    : Number(R.book && R.book.progressPct) || 0;
  document.getElementById('rb-progress').textContent = `· ${progress}%`;
  document.getElementById('rb-toc').style.setProperty('--reading-progress', `${Math.max(0, Math.min(100, progress))}%`);
  document.getElementById('rb-library-count').textContent = `${R.marks.length} 书签 · ${R.annos.length} 批注`;
  reader.classList.add('bar-open');
}

function closeBar() { reader.classList.remove('bar-open'); }

reader.addEventListener('click', async (e) => {
  if (e.target.closest('#r-back')) { exitReader(); return; }
  if (e.target.closest('#selection-tools')) return;
  if (e.target.closest('#r-mark')) { toggleBookmark(); return; }

  if (e.target.closest('#rb-toc')) { closeBar(); openTocSheet(); return; }
  if (e.target.closest('#rb-library')) { closeBar(); openLibrarySheet(); return; }
  if (e.target.closest('#rb-theme')) { closeBar(); openSetSheet(); return; }
  if (e.target.closest('#rbar')) return;
  // 工具条展开期间：点任意处只收起，不翻页不选中
  if (reader.classList.contains('bar-open')) { closeBar(); return; }

  const nativeSelection = window.getSelection();
  if (Date.now() < R.suppressReaderClickUntil || (nativeSelection && !nativeSelection.isCollapsed)) return;
  if (PaintSelect.range) { clearNativeSelection(); return; }

  const bub = e.target.closest('.bub');
  if (bub) {
    const anno = R.annos.find((a) => a.id === bub.dataset.id);
    if (anno) openSheet('detail', anno, {});
    return;
  }

  const seg = e.target.closest('.seg');
  if (seg && seg.dataset.ids) {
    const anno = R.annos.find((a) => a.id === seg.dataset.ids.split(',')[0]);
    if (anno) openSheet('detail', anno, {});
    return;
  }

  const x = e.clientX / window.innerWidth;
  if (settings.pageMode === 'tap' && x < 0.33) turnPage(-1);
  else if (settings.pageMode === 'tap' && x > 0.67) turnPage(1);
  else openBar();
});

/* ── 选字划线：鼠标用系统选字，触屏用荧光笔涂抹 ── */

function makeSelectionClientId() {
  const clientId = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
    ? `reading-selection-${globalThis.crypto.randomUUID()}`
    : `reading-selection-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  return clientId;
}

const callStatusWaiters = new Map();
const callDeliveryWaiters = new Map();
const acceptedCallRequests = new Set();
function callRequestId(prefix) {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function activeHomeCall() {
  if (!HOME_HOSTED) return Promise.resolve(false);
  const requestId = callRequestId('books-call-status');
  return new Promise((resolve) => {
    const timer = window.setTimeout(() => {
      callStatusWaiters.delete(requestId);
      resolve(false);
    }, 800);
    callStatusWaiters.set(requestId, (connected) => {
      window.clearTimeout(timer);
      resolve(Boolean(connected));
    });
    window.parent.postMessage({ type: 'guichao-books:call-status', requestId }, location.origin);
  });
}

function sendSelectionToCall(annotation, note = '', deliveryId = annotation?.id) {
  if (!HOME_HOSTED || !annotation) return Promise.reject(new Error('电话入口不可用'));
  const requestId = callRequestId('books-call-selection');
  return new Promise((resolve, reject) => {
    const timer = window.setTimeout(() => {
      callDeliveryWaiters.delete(requestId);
      reject(new Error('电话没有确认收到'));
    }, 8000);
    callDeliveryWaiters.set(requestId, {
      resolve: (value) => { window.clearTimeout(timer); resolve(value); },
      reject: (error) => { window.clearTimeout(timer); reject(error); },
    });
    window.parent.postMessage({
      type: 'guichao-books:call-selection',
      requestId,
      selection: {
        selectionId: annotation.id,
        deliveryId,
        bookId: R.book?.bookId || '',
        bookTitle: R.manifest?.title || R.book?.title || '',
        chapterTitle: annotation.chapterTitle || '',
        quote: annotation.quote || '',
        context: annotation.context || annotation.quote || '',
        note: String(note || '').trim(),
      },
    }, location.origin);
  });
}

function commitCallDelivery(requestId) {
  window.parent.postMessage({ type: 'guichao-books:call-committed', requestId }, location.origin);
}

window.addEventListener('message', (event) => {
  if (!HOME_HOSTED || event.origin !== location.origin || event.source !== window.parent) return;
  if (event.data?.type === 'guichao-books:call-status') {
    const requestId = String(event.data.requestId || '');
    const finish = callStatusWaiters.get(requestId);
    if (!finish) return;
    callStatusWaiters.delete(requestId);
    finish(event.data.connected === true);
    return;
  }
  if (event.data?.type === 'guichao-books:call-accepted') {
    const requestId = String(event.data.requestId || '');
    const waiter = callDeliveryWaiters.get(requestId);
    if (!waiter) return;
    callDeliveryWaiters.delete(requestId);
    if (event.data.ok !== true) {
      waiter.reject(new Error('电话没有确认收到'));
      return;
    }
    acceptedCallRequests.add(requestId);
    waiter.resolve(event.data);
    return;
  }
  if (event.data?.type === 'guichao-books:call-result') {
    const requestId = String(event.data.requestId || '');
    if (event.data.ok === true) {
      acceptedCallRequests.delete(requestId);
      return;
    }
    const waiter = callDeliveryWaiters.get(requestId);
    if (waiter) {
      callDeliveryWaiters.delete(requestId);
      waiter.reject(new Error(event.data.error || '这句没有送到电话里'));
      return;
    }
    if (acceptedCallRequests.delete(requestId)) toast(event.data.error || '共读者接住了这句，但这次没有说完');
  }
});

function pointInParagraph(node, offset) {
  const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
  const para = el && el.closest ? el.closest('p[data-i]') : null;
  if (!para || !rFlow.contains(para)) return null;
  try {
    const prefix = document.createRange();
    prefix.selectNodeContents(para);
    prefix.setEnd(node, offset);
    return { paraIdx: Number(para.dataset.i), off: prefix.toString().length };
  } catch { return null; }
}

function pendingFromParagraph(paraIdx, startOffset, endOffset) {
  const ch = R.chapters[R.ch];
  const text = ch && ch.paragraphs[paraIdx];
  if (typeof text !== 'string') return null;
  const startOff = clamp(startOffset, 0, text.length);
  const endOff = clamp(endOffset, 0, text.length);
  if (endOff <= startOff) return null;
  return {
    chapter: R.ch,
    chapterTitle: ch.title || '',
    paraIdx,
    startOff,
    endOff,
    quote: text.slice(startOff, endOff),
    context: text,
    clientId: makeSelectionClientId(),
  };
}

function pendingFromNativeSelection() {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount !== 1 || selection.isCollapsed) return null;
  const range = selection.getRangeAt(0);
  const start = pointInParagraph(range.startContainer, range.startOffset);
  const end = pointInParagraph(range.endContainer, range.endOffset);
  if (!start || !end) return null;
  if (start.paraIdx !== end.paraIdx) return { error: 'cross-paragraph' };
  return pendingFromParagraph(start.paraIdx, start.off, end.off);
}

function activeSelectionRange() {
  if (PaintSelect.range) return PaintSelect.range;
  const selection = window.getSelection?.();
  return selection?.rangeCount && !selection.isCollapsed ? selection.getRangeAt(0) : null;
}

  function positionSelectionTools() {
    const toolbar = document.getElementById('selection-tools');
    const range = activeSelectionRange();
    if (!toolbar || !range) return;
    const viewport = window.visualViewport;
    const safeArea = window.openai?.safeArea;
    const safeTop = Number(safeArea?.insets?.top ?? safeArea?.top) || 0;
    const safeBottom = Number(safeArea?.insets?.bottom ?? safeArea?.bottom) || 0;
    const top = Math.max(viewport?.offsetTop || 0, safeTop) + 8;
    const bottom = Math.min(window.innerHeight - safeBottom,
      (viewport?.offsetTop || 0) + (viewport?.height || window.innerHeight)) - 8;
    const left = (viewport?.offsetLeft || 0) + 8;
    const right = left + (viewport?.width || window.innerWidth) - 16;
    const rects = Array.from(range.getClientRects())
      .filter(rect => rect.width > 0 && rect.height > 0 && rect.bottom > top && rect.top < bottom && rect.right > left && rect.left < right);
    if (!rects.length) return;
    const first = rects[0];
    const last = rects[rects.length - 1];
    const height = toolbar.offsetHeight;
    const width = toolbar.offsetWidth;
    const above = first.top - height - 12;
    const below = last.bottom + 12;
    const preferBelow = (first.top + last.bottom) / 2 >= (top + bottom) / 2;
    const belowFits = below + height <= bottom;
    const y = preferBelow && belowFits ? below : above >= top ? above : belowFits ? below : top;
    const x = Math.max(left + width / 2, Math.min(right - width / 2, (first.left + first.right) / 2));
    toolbar.style.setProperty('--books-selection-top', Math.round(Math.min(y, Math.max(top, bottom - height))) + 'px');
    toolbar.style.setProperty('--books-selection-left', Math.round(x) + 'px');
  }
  window.addEventListener('resize', positionSelectionTools, { passive: true });
  window.visualViewport?.addEventListener('resize', positionSelectionTools, { passive: true });
  window.visualViewport?.addEventListener('scroll', positionSelectionTools, { passive: true });


function hideSelectionTools() { selectionTools.classList.remove('show'); }

function clearNativeSelection({ keepPending = false } = {}) {
  hideSelectionTools();
  const selection = window.getSelection();
  if (selection) selection.removeAllRanges();
  showPaint(null);
  if (!keepPending) R.pendingSel = null;
}

let selectionSyncTimer = null;
function syncNativeSelection() {
  clearTimeout(selectionSyncTimer);
  if (PaintSelect.active || PaintSelect.range) return;
  selectionSyncTimer = setTimeout(() => {
    if (!reader.classList.contains('open') || document.querySelector('.sheet.open')) { hideSelectionTools(); return; }
    const pending = pendingFromNativeSelection();
    if (!pending) { hideSelectionTools(); return; }
    if (pending.error === 'cross-paragraph') {
      hideSelectionTools();
      toast('一次先选同一段里的话');
      return;
    }
    R.pendingSel = pending;
    R.suppressReaderClickUntil = Date.now() + 600;
    positionSelectionTools();
    selectionTools.classList.add('show');
  }, 120);
}

document.addEventListener('selectionchange', syncNativeSelection);
// Desktop browsers can finish updating the native range after selectionchange.
// Re-read it once the mouse or pointer is released so the Books action bar is
// never left behind a stale/collapsed intermediate selection.
function syncNativeSelectionAfterPointer() {
  window.setTimeout(syncNativeSelection, 0);
}
rViewport.addEventListener('pointerup', syncNativeSelectionAfterPointer);
rViewport.addEventListener('mouseup', syncNativeSelectionAfterPointer);
rViewport.addEventListener('keyup', syncNativeSelectionAfterPointer);

/* ── 荧光笔：长按开始涂，手指划过的字涂成粉色，松手后操作条出现在上方 ── */

const PAINT_HOLD_MS = 380;
const PAINT_MOVE_SLOP = 8;

function caretPointAt(x, y) {
  const range = document.caretRangeFromPoint?.(x, y);
  if (range) return pointInParagraph(range.startContainer, range.startOffset);
  const position = document.caretPositionFromPoint?.(x, y);
  return position ? pointInParagraph(position.offsetNode, position.offset) : null;
}

function domPointInParagraph(para, off) {
  const walker = document.createTreeWalker(para, NodeFilter.SHOW_TEXT);
  let left = off;
  let last = null;
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    last = node;
    if (left <= node.data.length) return [node, left];
    left -= node.data.length;
  }
  return last ? [last, last.data.length] : [para, 0];
}

function showPaint(range) {
  PaintSelect.range = range;
  if (!PaintSelect.enabled) return;
  if (range) CSS.highlights.set('books-paint', new Highlight(range));
  else CSS.highlights.delete('books-paint');
}

function paintedOffsets() {
  const start = Math.min(PaintSelect.anchorOff, PaintSelect.focusOff);
  const end = Math.max(PaintSelect.anchorOff, PaintSelect.focusOff);
  // 起点那个字总是涂上，手指往回划也不会变成空选。
  return PaintSelect.focusOff >= PaintSelect.anchorOff ? [start, Math.max(end, start + 1)] : [start, PaintSelect.anchorOff + 1];
}

function renderPaint() {
  const para = rFlow.querySelector(`p[data-i="${PaintSelect.paraIdx}"]`);
  const text = R.chapters[R.ch]?.paragraphs[PaintSelect.paraIdx];
  if (!para || typeof text !== 'string') return;
  const [start, end] = paintedOffsets().map((off) => clamp(off, 0, text.length));
  const range = document.createRange();
  range.setStart(...domPointInParagraph(para, start));
  range.setEnd(...domPointInParagraph(para, end));
  showPaint(range);
}

function movePaintFocus(x, y) {
  const point = caretPointAt(x, y);
  if (!point) return;
  const text = R.chapters[R.ch]?.paragraphs[PaintSelect.paraIdx] || '';
  // 一次只涂同一段：手指出了这一段，就停在段首或段尾。
  if (point.paraIdx === PaintSelect.paraIdx) PaintSelect.focusOff = point.off;
  else PaintSelect.focusOff = point.paraIdx < PaintSelect.paraIdx ? 0 : text.length;
  renderPaint();
}

function cancelPaintHold() {
  clearTimeout(PaintSelect.timer);
  PaintSelect.timer = 0;
}

function finishPaint() {
  cancelPaintHold();
  if (!PaintSelect.active) return;
  PaintSelect.active = false;
  const [start, end] = paintedOffsets();
  const pending = pendingFromParagraph(PaintSelect.paraIdx, start, end);
  if (!pending) { clearNativeSelection(); return; }
  R.pendingSel = pending;
  R.suppressReaderClickUntil = Date.now() + 600;
  positionSelectionTools();
  selectionTools.classList.add('show');
}

if (PaintSelect.enabled) {
  rViewport.addEventListener('touchstart', (event) => {
    cancelPaintHold();
    if (event.touches.length !== 1 || document.querySelector('.sheet.open')) return;
    const touch = event.touches[0];
    PaintSelect.startX = touch.clientX;
    PaintSelect.startY = touch.clientY;
    PaintSelect.timer = setTimeout(() => {
      PaintSelect.timer = 0;
      const point = caretPointAt(PaintSelect.startX, PaintSelect.startY);
      if (!point) return;
      clearNativeSelection();
      PaintSelect.active = true;
      PaintSelect.paraIdx = point.paraIdx;
      PaintSelect.anchorOff = PaintSelect.focusOff = point.off;
      ReaderGesture.cancelled = true;
      renderPaint();
    }, PAINT_HOLD_MS);
  }, { passive: true });

  rViewport.addEventListener('touchmove', (event) => {
    const touch = event.touches[0];
    if (!touch) return;
    if (PaintSelect.timer && Math.hypot(touch.clientX - PaintSelect.startX, touch.clientY - PaintSelect.startY) > PAINT_MOVE_SLOP) cancelPaintHold();
    if (!PaintSelect.active) return;
    event.preventDefault();
    movePaintFocus(touch.clientX, touch.clientY);
  }, { passive: false });

  rViewport.addEventListener('touchend', finishPaint, { passive: true });
  rViewport.addEventListener('touchcancel', finishPaint, { passive: true });
}

async function savePendingSelection(comment = '') {
  if (!R.pendingSel || R.selectionBusy) return null;
  R.selectionBusy = true;
  const payload = { ...R.pendingSel };
  clearNativeSelection({ keepPending: true });
  try {
    const routeToCall = await activeHomeCall();
    const { annotation, duplicateSelection } = await apiPost('/annotations', {
      bookId: R.book.bookId,
      author: 'human',
      comment,
      delivery: routeToCall ? 'call' : 'home',
      ...payload,
    });
    if (duplicateSelection) {
      await refreshAnnos({ rerender: true });
      R.pendingSel = null;
      return { annotation, duplicateSelection: true };
    }
    let deliveredToCall = false;
    if (routeToCall) {
      let accepted = null;
      try {
        accepted = await sendSelectionToCall(annotation, comment, annotation.id);
        await apiPost(`/annotations/${R.book.bookId}/${annotation.id}/delivery`, {
          deliveryId: annotation.id,
          status: 'accepted',
        });
        commitCallDelivery(accepted.requestId);
        deliveredToCall = true;
      } catch (error) {
        if (accepted?.requestId) acceptedCallRequests.delete(accepted.requestId);
        await apiPost(`/annotations/${R.book.bookId}/${annotation.id}/deliver`, { deliveryId: annotation.id });
      }
    }
    await refreshAnnos({ rerender: true });
    toast(deliveredToCall ? '这一句送进电话了' : '这一句已保存');
    R.pendingSel = null;
    return { annotation, duplicateSelection: false };
  } finally {
    R.selectionBusy = false;
  }
}

document.getElementById('selection-share').addEventListener('click', async () => {
  try {
    const saved = await savePendingSelection('');
    if (saved) openSheet('detail', saved.annotation, { jump: false });
  } catch (e) { toast('保存失败：' + e.message); }
});
function existingPendingSelection() {
  const pending = R.pendingSel;
  const chapter = pending && R.chapters[pending.chapter];
  if (!chapter || !Number.isInteger(chapter.baseSeq)) return null;
  const seq = chapter.baseSeq + pending.paraIdx;
  return R.annos.find((item) => item.createdBy === 'human' && item.seq === seq
    && item.startOff === pending.startOff && item.endOff === pending.endOff) || null;
}
document.getElementById('selection-write').addEventListener('click', () => {
  if (!R.pendingSel) return;
  const existing = existingPendingSelection();
  if (existing) {
    clearNativeSelection();
    openSheet('detail', existing, { jump: false });
    return;
  }
  clearNativeSelection({ keepPending: true });
  openSheet('create', null, {});
});

/* ── 横滑翻页：快速横移接管，长按选字优先 ── */

rViewport.addEventListener('touchstart', (event) => {
  if (settings.pageMode !== 'swipe') return;
  if (event.touches.length !== 1 || selectionTools.classList.contains('show')) return;
  const touch = event.touches[0];
  if (touch.clientX < 24 || touch.clientX > window.innerWidth - 24) return;
  ReaderGesture.active = true; ReaderGesture.horizontal = false; ReaderGesture.cancelled = false;
  ReaderGesture.startX = ReaderGesture.lastX = touch.clientX;
  ReaderGesture.startY = touch.clientY; ReaderGesture.startedAt = performance.now();
}, { passive: true });

rViewport.addEventListener('touchmove', (event) => {
  if (!ReaderGesture.active || event.touches.length !== 1) return;
  const selection = window.getSelection();
  if (selection && !selection.isCollapsed) { ReaderGesture.cancelled = true; return; }
  const touch = event.touches[0];
  const dx = touch.clientX - ReaderGesture.startX;
  const dy = touch.clientY - ReaderGesture.startY;
  ReaderGesture.lastX = touch.clientX;
  if (!ReaderGesture.horizontal && Math.abs(dx) > 12) {
    ReaderGesture.horizontal = Math.abs(dx) > Math.abs(dy) * 1.2 && performance.now() - ReaderGesture.startedAt < 420;
    if (!ReaderGesture.horizontal && Math.abs(dy) > 12) ReaderGesture.cancelled = true;
  }
  if (!ReaderGesture.horizontal || ReaderGesture.cancelled) return;
  event.preventDefault();
  R.suppressReaderClickUntil = Date.now() + 500;
  rFlow.classList.add('no-transition');
  const atStart = R.page === 0 && R.ch === 0 && dx > 0;
  const atEnd = R.page === R.pages - 1 && R.ch === R.manifest.chapterCount - 1 && dx < 0;
  const drag = (atStart || atEnd) ? dx * .26 : dx;
  rFlow.style.transform = `translateX(${(-R.page * R.step) + drag}px)`;
}, { passive: false });

async function finishReaderGesture() {
  if (!ReaderGesture.active) return;
  const dx = ReaderGesture.lastX - ReaderGesture.startX;
  const elapsed = Math.max(1, performance.now() - ReaderGesture.startedAt);
  const velocity = Math.abs(dx) / elapsed;
  const wasHorizontal = ReaderGesture.horizontal;
  const wasCancelled = ReaderGesture.cancelled;
  const shouldTurn = wasHorizontal && !wasCancelled && (Math.abs(dx) > Math.max(42, window.innerWidth * .14) || (Math.abs(dx) > 18 && velocity > .45));
  ReaderGesture.active = false;
  if (!wasHorizontal) return;
  rFlow.classList.remove('no-transition');
  if (wasCancelled) { gotoPage(R.page, { silentIfSame: false }); return; }
  if (shouldTurn) await turnPage(dx < 0 ? 1 : -1);
  else gotoPage(R.page, { silentIfSame: false });
}

rViewport.addEventListener('touchend', finishReaderGesture, { passive: true });
rViewport.addEventListener('touchcancel', finishReaderGesture, { passive: true });

/* ── 底部弹窗 ── */

function replyPartnerLabel() {
  return People.companion.name;
}

function replyFeedbackFor(anno) {
  if (R.replyDelivery?.annotationId === anno.id) return R.replyDelivery;
  const comments = Array.isArray(anno.comments) ? anno.comments : [];
  let lastHuman = -1;
  comments.forEach((comment, index) => {
    if (comment.author === 'human') lastHuman = index;
  });
  if (lastHuman < 0) return null;
  const laterAi = comments.slice(lastHuman + 1).filter((comment) => comment.author === 'ai');
  if (laterAi.some((comment) => comment.final !== false)) return null;
  if (laterAi.some((comment) => comment.final === false)) {
    return { status: 'replying', text: `${replyPartnerLabel()}在回你` };
  }
  const human = comments[lastHuman];
  if (human?.delivery?.status === 'failed') {
    return { status: 'failed', text: '这次没送到', comment: human };
  }
  return null;
}

function replyFeedbackHtml(feedback) {
  if (!feedback) return '';
  if (feedback.status === 'sending') {
    return `<div class="reply-feedback to-companion"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>${esc(feedback.text)}</span></div>`;
  }
  if (feedback.status === 'replying') {
    return `<div class="reply-feedback from-companion"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>${esc(feedback.text)}</span></div>`;
  }
  if (feedback.status === 'failed') {
    return `<div class="reply-feedback to-companion"><span>${esc(feedback.text)}</span><button class="reply-retry" type="button" data-retry-reply>再试一次</button></div>`;
  }
  return '';
}

function renderComments(anno) {
  const group = selectionGroup(anno);
  if (!group.some((item) => item.id === anno.id)) group.push(anno);
  const entries = group.map((item) => ({ item, creator: personFor(item), root: annotationRoot(item) }));
  const rootsHtml = entries.map(({ creator, root }) => {
    const creatorSide = creator === People.human ? 'human' : 'companion';
    return root.text ? `<article class="annotation-block">
      ${avatarHtml(creator, creatorSide)}
      <div class="annotation-body">
        <div class="annotation-meta"><strong class="${personNameClass(creator)}">${esc(creator.name)}</strong><span>${fmtThreadTime(root.at)}</span><span class="annotation-kind">批注</span></div>
        <div class="annotation-text">${esc(root.text)}</div>
      </div>
    </article>` : `<div class="anno-root-empty">划线 · ${fmtThreadTime(root.at)}</div>`;
  }).join('');
  const replies = entries.flatMap(({ root }) => root.replies).sort((a, b) =>
    String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  const repliesHtml = replies.map((comment) => {
    const person = personFor(comment);
    const fromHuman = person === People.human;
    const meta = fromHuman
      ? `<div class="reply-meta"><span>${fmtThreadTime(comment.createdAt)}</span><strong>${esc(person.name)}</strong></div>`
      : `<div class="reply-meta"><strong>${esc(person.name)}</strong><span>${fmtThreadTime(comment.createdAt)}</span></div>`;
    const content = `<div class="reply-content">${meta}<div class="reply-bubble">${esc(comment.text)}</div></div>`;
    return fromHuman
      ? `<article class="reply-row from-human">${content}</article>`
      : `<article class="reply-row from-companion">${content}</article>`;
  }).join('');
  const feedback = R.detailAnno ? replyFeedbackHtml(replyFeedbackFor(R.detailAnno)) : '';
  document.getElementById('sheet-comments').innerHTML = `<div class="selection-annotations">${rootsHtml}</div><div class="reply-thread">${repliesHtml}${feedback}</div>`;
}

let detailPollGeneration = 0;
function stopDetailPolling() {
  detailPollGeneration += 1;
  if (R.detailPollTimer) clearTimeout(R.detailPollTimer);
  R.detailPollTimer = null;
  R.detailPollUntil = 0;
}

function startDetailPolling() {
  stopDetailPolling();
  if (!R.detailAnno || !R.book) return;
  const generation = detailPollGeneration;
  const bookId = R.book.bookId;
  const annotationId = R.detailAnno.id;
  R.detailPollUntil = Date.now() + 10 * 60 * 1000;
  const poll = async () => {
    if (generation !== detailPollGeneration) return;
    if (!R.detailAnno || R.detailAnno.id !== annotationId || R.book?.bookId !== bookId || !sheet.classList.contains('open')) return stopDetailPolling();
    if (Date.now() > R.detailPollUntil) {
      R.replyDelivery = null;
      renderComments(R.detailAnno);
      return stopDetailPolling();
    }
    try {
      const { annotations } = await apiGet('/annotations/' + bookId);
      if (generation !== detailPollGeneration || R.detailAnno?.id !== annotationId || R.book?.bookId !== bookId) return;
      const previous = JSON.stringify(selectionGroup(R.detailAnno));
      R.annos = annotations;
      const fresh = annotations.find((a) => a.id === annotationId);
      if (fresh) {
        R.detailAnno = fresh;
        if (JSON.stringify(selectionGroup(fresh)) !== previous) renderComments(fresh);
      }
    } catch {}
    if (generation !== detailPollGeneration) return;
    const remainingMs = R.detailPollUntil - Date.now();
    R.detailPollTimer = setTimeout(poll, remainingMs > 8 * 60 * 1000 ? 2000 : 10000);
  };
  R.detailPollTimer = setTimeout(poll, 1200);
}

function resizeAnnotationInput() {
  const input = document.getElementById('sheet-text');
  const minimum = R.sheetMode === 'create' ? 116 : 44;
  const maximum = Math.max(44, Math.min(240, window.innerHeight * .32));
  input.style.height = 'auto';
  input.style.height = Math.min(maximum, Math.max(minimum, input.scrollHeight)) + 'px';
}
document.getElementById('sheet-text').addEventListener('input', resizeAnnotationInput);

function openSheet(mode, anno, { jump = false } = {}) {
  stopDetailPolling();
  R.sheetMode = mode;
  R.detailAnno = anno;
  sheet.dataset.mode = mode;
  const quoteWrap = document.getElementById('sheet-quote-wrap');
  const quoteEl = document.getElementById('sheet-quote');
  const jumpEl = document.getElementById('sheet-jump');
  const textEl = document.getElementById('sheet-text');
  quoteWrap.classList.toggle('by-ai', mode === 'detail' && anno?.createdBy === 'ai');
  if (mode === 'create') {
    quoteEl.textContent = R.pendingSel.quote;
    document.getElementById('sheet-comments').innerHTML = '';
    textEl.placeholder = '写批注…';
    document.getElementById('sheet-send').setAttribute('aria-label', '保存批注');
  } else {
    quoteEl.textContent = anno.quote;
    renderComments(anno);
    textEl.placeholder = '回复…';
    document.getElementById('sheet-send').setAttribute('aria-label', '发送回复');
  }
  quoteWrap.classList.toggle('can-jump', jump);
  jumpEl.style.display = jump ? '' : 'none';
  textEl.value = '';
  sheetMask.classList.add('open');
  sheet.classList.add('open');
  resizeAnnotationInput();
  if (mode === 'detail') startDetailPolling();
}

function openSheetEl(el) {
  sheetMask.classList.add('open');
  el.classList.add('open');
}

function closeSheet() {
  stopDetailPolling();
  sheetMask.classList.remove('open');
  document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('open'));
  R.sheetMode = null;
  R.detailAnno = null;
  R.replyDelivery = null;
  delete sheet.dataset.mode;
}

sheetMask.addEventListener('click', closeSheet);

function mergeDetailComment(comment) {
  if (!R.detailAnno || !comment) return;
  if (!Array.isArray(R.detailAnno.comments)) R.detailAnno.comments = [];
  const index = R.detailAnno.comments.findIndex((item) => item.id === comment.id || (comment.clientId && item.clientId === comment.clientId));
  if (index >= 0) R.detailAnno.comments[index] = comment;
  else R.detailAnno.comments.push(comment);
}

async function submitThreadReply({ text, clientId, retryDelivery = false, clearInput = false }) {
  if (!R.detailAnno || !text || !clientId) return;
  stopDetailPolling();
  const activeAnnotationId = R.detailAnno.id;
  const sendButton = document.getElementById('sheet-send');
  R.replyDelivery = {
    annotationId: R.detailAnno.id,
    status: 'sending',
    text: `正在送给${replyPartnerLabel()}`,
    comment: { text, clientId },
  };
  renderComments(R.detailAnno);
  sendButton.disabled = true;
  try {
    const annotation = R.detailAnno;
    const routeToCall = !retryDelivery && await activeHomeCall();
    let result = await apiPost(`/annotations/${R.book.bookId}/${annotation.id}/comment`, {
      author: 'human', text, clientId, retryDelivery, delivery: routeToCall ? 'call' : 'home',
    });
    if (routeToCall) {
      let accepted = null;
      try {
        accepted = await sendSelectionToCall(annotation, text, result.comment.id);
        result = await apiPost(`/annotations/${R.book.bookId}/${annotation.id}/delivery`, {
          deliveryId: result.comment.id,
          commentId: result.comment.id,
          status: 'accepted',
        });
        commitCallDelivery(accepted.requestId);
      } catch (error) {
        if (accepted?.requestId) acceptedCallRequests.delete(accepted.requestId);
        result = await apiPost(`/annotations/${R.book.bookId}/${annotation.id}/comment`, {
          author: 'human', text, clientId, retryDelivery: true, delivery: 'home',
        });
      }
    }
    mergeDetailComment(result.comment);
    R.replyDelivery = null;
    renderComments(R.detailAnno);
    if (clearInput) { document.getElementById('sheet-text').value = ''; resizeAnnotationInput(); }
    await refreshAnnos({ rerender: reader.classList.contains('open') });
  } catch (error) {
    R.replyDelivery = {
      annotationId: R.detailAnno.id,
      status: 'failed',
      text: '这次没送到',
      comment: { text, clientId },
    };
    renderComments(R.detailAnno);
    toast('这次没送到，再试一次');
  } finally {
    sendButton.disabled = false;
    if (R.detailAnno?.id === activeAnnotationId && sheet.classList.contains('open')) startDetailPolling();
  }
}

const sheetSendButton = document.getElementById('sheet-send');
// 键盘开着时，输入框失焦会让批注板跟着键盘下滑，按钮从手指下移开；按下发送时保持焦点，一次就能发出。
sheetSendButton.addEventListener('mousedown', (event) => event.preventDefault());
sheetSendButton.addEventListener('touchend', (event) => {
  const touch = event.changedTouches[0];
  const rect = sheetSendButton.getBoundingClientRect();
  if (!touch || touch.clientX < rect.left || touch.clientX > rect.right || touch.clientY < rect.top || touch.clientY > rect.bottom) return;
  event.preventDefault();
  if (!sheetSendButton.disabled) sendSheet();
});
sheetSendButton.addEventListener('click', () => sendSheet());

async function sendSheet() {
  const textEl = document.getElementById('sheet-text');
  const text = textEl.value.trim();
  if (R.sheetMode !== 'create' && !text) return;
  try {
    if (R.sheetMode === 'create') {
      const saved = await savePendingSelection(text);
      if (saved) {
        openSheet('detail', saved.annotation, { jump: false });
        if (saved.duplicateSelection && text) {
          const clientId = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
            ? `reading-comment-${globalThis.crypto.randomUUID()}`
            : `reading-comment-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          await submitThreadReply({ text, clientId, clearInput: true });
        }
      }
    } else if (R.detailAnno) {
      const clientId = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
        ? `reading-comment-${globalThis.crypto.randomUUID()}`
        : `reading-comment-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      await submitThreadReply({ text, clientId, clearInput: true });
    }
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

document.getElementById('sheet-comments').addEventListener('click', async (event) => {
  if (!event.target.closest('[data-retry-reply]') || !R.detailAnno) return;
  const local = R.replyDelivery?.status === 'failed' ? R.replyDelivery.comment : null;
  const persisted = (Array.isArray(R.detailAnno.comments) ? R.detailAnno.comments : [])
    .slice().reverse().find((comment) => comment.author === 'human' && comment.delivery?.status === 'failed');
  const target = local || persisted;
  if (!target?.text || !target?.clientId) return;
  await submitThreadReply({ text: target.text, clientId: target.clientId, retryDelivery: true });
});

document.getElementById('sheet-jump').addEventListener('click', async () => {
  const anno = R.detailAnno;
  if (!anno || !R.manifest) return;
  closeSheet();
  let chIdx = 0;
  for (const ch of R.manifest.chapters) {
    if (ch.baseSeq <= anno.seq) chIdx = ch.idx;
    else break;
  }
  await enterReader(chIdx, anno.seq);
  const seg = rFlow.querySelector(`.seg[data-ids*="${anno.id}"]`);
  if (seg) { seg.classList.add('flash'); setTimeout(() => seg.classList.remove('flash'), 1700); }
});

async function refreshAnnos({ rerender = false } = {}) {
  try {
    const { annotations } = await apiGet('/annotations/' + R.book.bookId);
    R.annos = annotations;
    if (rerender && reader.classList.contains('open')) {
      const keep = R.page;
      rFlow.classList.add('no-transition');
      renderChapterHtml(R.chapters[R.ch]);
      paginate();
      gotoPage(keep, { silentIfSame: false });
      requestAnimationFrame(() => rFlow.classList.remove('no-transition'));
    }
  } catch {}
}

function relayout() {
  if (!reader.classList.contains('open') || !R.chapters[R.ch]) return;
  clearNativeSelection();
  const range = currentParaRange();
  rFlow.classList.add('no-transition');
  renderChapterHtml(R.chapters[R.ch]);
  paginate();
  let page = 0;
  if (range) {
    const paraIdx = range.seqStart - R.chapters[R.ch].baseSeq;
    page = R.paraPages[paraIdx] ? R.paraPages[paraIdx].start : 0;
  }
  gotoPage(page, { silentIfSame: false });
  requestAnimationFrame(() => rFlow.classList.remove('no-transition'));
}

window.addEventListener('resize', relayout);

/* ── 工具条：目录 / 设置 ── */

function openTocSheet() {
  const list = document.getElementById('toc-list');
  list.innerHTML = R.manifest.chapters.map((ch) =>
    `<div class="toc-item${ch.idx === R.ch ? ' cur' : ''}" data-ch="${ch.idx}"><span>${esc(ch.title)}</span><span class="toc-chars">${ch.chars}字</span></div>`
  ).join('');
  openSheetEl(document.getElementById('sheet-toc'));
  const cur = list.querySelector('.cur');
  if (cur) cur.scrollIntoView({ block: 'center' });
}

document.getElementById('toc-list').addEventListener('click', async (e) => {
  const item = e.target.closest('.toc-item');
  if (!item) return;
  closeSheet();
  await showChapter(Number(item.dataset.ch), null);
});

function setTypography(key, value) {
  settings[key] = key === 'fontSize'
    ? clamp(Math.round(Number(value)), 15, 22)
    : clamp(Math.round(Number(value) * 10) / 10, 1.6, 2.4);
  saveSettings();
  applyTypography();
  relayout();
}

document.getElementById('typography-controls').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-setting]');
  if (!button) return;
  const key = button.dataset.setting;
  setTypography(key, Number(settings[key]) + Number(button.dataset.delta));
});

document.getElementById('theme-seg').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  settings.theme = b.dataset.t;
  saveSettings();
  applyTheme();
});

document.getElementById('page-mode').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  settings.pageMode = button.dataset.mode;
  saveSettings();
  applyPageMode();
});

document.getElementById('settings-close').addEventListener('click', closeSheet);

function openSetSheet() {
  applyTheme();
  applyTypography();
  applyPageMode();
  openSheetEl(document.getElementById('sheet-set'));
}

async function boot() {
  applyTheme();
  if (HOME_HOSTED && window.parent !== window) window.parent.postMessage({ type: 'guichao-books:view', view: 'shelf' }, location.origin);
  applyTypography();
  applyPageMode();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration('/reading/').then((registration) => registration?.update()).catch(() => {});
  }
  shelfEl.classList.remove('loading-hidden');
  await loadShelf();
  const params = new URLSearchParams(location.search);
  const open = params.get('open');
  if (open && R.books.some(book => book.bookId === open)) {
    const chapter = Number(params.get('chapter'));
    const seq = Number(params.get('seq'));
    if (params.has('seq') && Number.isInteger(chapter) && chapter >= 0 && Number.isInteger(seq) && seq >= 0) {
      if (await loadBookData(open)) await enterReader(chapter, seq);
    } else await openBookDirect(open);
  }
}

boot();
</script>
