<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fcf7f8">
<title>共读书架</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #fcf7f8; --text: #4e4548; --card: #fffafb; --panel: #fffafb;
  --muted: #94888c; --faint: #b9adb1; --quote: #7b6e74;
  --border: #e9dee2; --border-soft: #f0e7e9; --cover-ph: #ded6da;
  --accent: #947780; --accent-text: #fff;
  --human: #e9609b; --human-deep: #c2578d; --ai: #4a71b5;
  --toast-bg: rgba(40,36,30,.9); --toast-text: #fff;
  --shadow: rgba(0,0,0,.08); --shadow-deep: rgba(0,0,0,.18); --mask: rgba(0,0,0,.45);
  --reading-top-safe: env(safe-area-inset-top);
}
:root[data-home-hosted="1"] { width: 100%; height: 100%; min-height: 0; overflow: hidden; --reading-top-safe: 0px; overscroll-behavior: none; }
:root[data-home-hosted="1"] body { width: 100%; height: 100%; min-height: 0; overflow: hidden; overscroll-behavior: none; }
:root[data-theme="yellow"] {
  --bg: #f7f6f1; --text: #171715; --card: #fbfaf6; --panel: #f3f2ed;
  --muted: #8f8e89; --faint: #b2b1ab; --quote: #5f5e5a;
  --border: #d9d8d1; --border-soft: #e9e8e2; --cover-ph: #e4e2db;
  --accent: #171715; --accent-text: #f7f6f1;
  --toast-bg: rgba(23,23,21,.92); --toast-text: #f7f6f1;
  --shadow: rgba(35,33,28,.07); --shadow-deep: rgba(35,33,28,.15); --mask: rgba(20,20,18,.42);
}
:root[data-theme="night"] {
  --bg: #151514; --text: #dedbd9; --card: #1c1c1b; --panel: #191918;
  --muted: #999693; --faint: #74716f; --quote: #bbb7b4;
  --border: #353432; --border-soft: #292826; --cover-ph: #302f2d;
  --accent: #a58f9c; --accent-text: #fff;
  --human: #e9609b; --human-deep: #d478a6; --ai: #6f92cc;
  --toast-bg: rgba(232,232,238,.92); --toast-text: #202023;
  --shadow: rgba(0,0,0,.35); --shadow-deep: rgba(0,0,0,.5); --mask: rgba(0,0,0,.55);
}
html, body { width: 100%; min-height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); -webkit-user-select: none; user-select: none; }
body { overscroll-behavior-y: none; }
body.reader-open { height: 100dvh; overflow: hidden; }
button, input { font: inherit; color: inherit; }

/* ── 书架 ── */
.shelf { position: relative; width: min(100%, 460px); min-height: 100dvh; margin: 0 auto; padding-bottom: calc(38px + env(safe-area-inset-bottom)); overflow: hidden; background: var(--bg); }
:root[data-home-hosted="1"] .shelf { height: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; scrollbar-width: none; }
:root[data-home-hosted="1"] .shelf::-webkit-scrollbar { display: none; }
:root[data-theme="pink"] .shelf { background: var(--bg); }
:root[data-theme="night"] .shelf { background: var(--bg); }
body.reader-open .shelf { visibility: hidden; pointer-events: none; }
.shelf.loading-hidden { visibility: hidden; }
.shelf-topbar { height: calc(62px + var(--reading-top-safe)); padding: calc(8px + var(--reading-top-safe)) 22px 6px; display: flex; align-items: center; justify-content: space-between; }
.shelf-topbar h1 { margin: 0; font-size: 25px; line-height: 1; letter-spacing: -.04em; font-weight: 650; }
.shelf-topbar small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; letter-spacing: .02em; }
.stats-btn { width: 44px; height: 44px; margin-right: -8px; padding: 0; border: 0; display: grid; place-items: center; background: transparent; color: var(--muted); }
.stats-btn svg { width: 20px; height: 20px; }
.stats-btn:active { transform: scale(.94); color: var(--text); }
.shelf-stage { position: relative; height: 357px; perspective: 1100px; perspective-origin: 50% 42%; touch-action: pan-y; cursor: grab; }
.shelf-stage.dragging { cursor: grabbing; }
.shelf-stage::after { content: ""; position: absolute; z-index: 0; left: 50%; bottom: 32px; width: 210px; height: 22px; border-radius: 50%; background: rgba(50,52,52,.12); filter: blur(16px); transform: translateX(-50%); opacity: .56; pointer-events: none; }
.shelf-book { position: absolute; z-index: 1; top: 53px; left: 50%; width: 166px; height: 246px; padding: 0; border: 0; background: transparent; transform-origin: center; will-change: transform, opacity; transition: transform .52s cubic-bezier(.22,.72,.16,1), opacity .34s ease, filter .34s ease; }
.dragging .shelf-book { transition: none; }
.shelf-book[aria-hidden="true"] { pointer-events: none; }
.book-shell { position: absolute; inset: 0; border-radius: 5px 11px 11px 5px; background: #e9e9e6; box-shadow: 0 22px 62px rgba(74,61,69,.10), -8px 3px 14px rgba(41,43,43,.06); transform-style: preserve-3d; }
.book-shell::before { content: ""; position: absolute; z-index: -1; top: 6px; right: -7px; bottom: 6px; width: 12px; border-radius: 0 6px 6px 0; background: repeating-linear-gradient(90deg, #deded9 0 1px, #f8f8f4 1px 3px); transform: translateZ(-5px); }
.book-shell::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 11px; border-radius: 5px 0 0 5px; background: linear-gradient(90deg, rgba(23,24,24,.24), rgba(255,255,255,.12) 52%, transparent); mix-blend-mode: multiply; opacity: .48; pointer-events: none; }
.book-shell img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; pointer-events: none; }
.book-placeholder { display: grid; place-items: center; height: 100%; padding: 18px; color: var(--quote); font-size: 18px; line-height: 1.6; }
.shelf-book:not(.is-active) .book-shell { box-shadow: 0 15px 38px rgba(48,50,50,.09); }
.page-dots { height: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.page-dot { width: 5px; height: 5px; padding: 0; border: 0; border-radius: 999px; background: #c2c3c1; transition: width .28s ease, background .28s ease; }
.page-dot.on { width: 18px; background: #676b69; }
.book-info { min-height: 118px; padding: 8px 27px 20px; text-align: center; }
.book-info h2 { margin: 0; font-size: 21px; line-height: 1.24; letter-spacing: -.035em; font-weight: 630; }
.book-info .author { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.reading-panel { margin: 0 18px; padding: 18px 18px 17px; border: 1px solid rgba(255,255,255,.82); border-radius: 22px; background: rgba(253,251,252,.72); box-shadow: 0 14px 42px rgba(54,56,56,.07), inset 0 0 0 .5px rgba(52,54,54,.05); }
:root[data-theme="night"] .reading-panel { background: rgba(255,255,255,.035); border-color: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.025); }
:root[data-theme="night"] .note-card { background: rgba(255,255,255,.025); }
.progress-line { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.progress-line strong { font-size: 14px; font-weight: 600; }
.progress-line span { color: var(--muted); font-size: 12px; }
.track { height: 4px; margin: 13px 0 10px; overflow: hidden; border-radius: 4px; background: rgba(65,68,67,.09); }
.track i { display: block; height: 100%; min-width: 5px; border-radius: inherit; background: var(--accent); transition: width .44s cubic-bezier(.22,.72,.16,1); }
.reader-progresses { display: grid; gap: 3px; margin: 0 0 13px; text-align: left; }
.reader-progress { overflow: hidden; color: var(--muted); font-size: 11px; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
.panel-bottom { display: flex; align-items: center; justify-content: space-between; }
.read-time { color: var(--muted); font-size: 12px; }
.continue:disabled { opacity: .42; }
.continue { min-width: 106px; height: 39px; padding: 0 18px; border: 0; border-radius: 999px; color: #fff; background: var(--accent); box-shadow: 0 8px 18px rgba(86,68,79,.14); font-size: 13px; font-weight: 560; }
.continue:active { transform: scale(.98); }
.notes { padding: 28px 22px 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.section-head h3 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
.section-head button { border: 0; background: transparent; color: var(--muted); padding: 5px 0 5px 12px; font-size: 12px; }
.note-card { min-height: 103px; padding: 17px 17px 15px; border-top: 1px solid rgba(89,75,84,.09); border-bottom: 1px solid rgba(89,75,84,.09); background: rgba(255,255,255,.24); }
.home-quote { margin: 0; padding-left: 12px; border-left: 2px solid #a7aaa8; font-size: 14px; line-height: 1.72; letter-spacing: .005em; }
.note-meta { margin: 11px 0 0 14px; display: flex; gap: 9px; color: var(--muted); font-size: 11px; }
.empty-note { min-height: 92px; display: grid; place-items: center; border-top: 1px solid rgba(89,75,84,.09); color: var(--faint); font-size: 13px; }
.shelf-empty { padding: 110px 32px 0; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }

@media (max-height: 720px) { .shelf-stage { height: 317px; } .shelf-book { top: 39px; width: 146px; height: 216px; } .shelf-stage::after { bottom: 41px; } .book-info { min-height: 100px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }

/* ── 覆盖层（书籍面板） ── */
.overlay { position: fixed; inset: 0; background: var(--mask); display: none; align-items: flex-end; z-index: 20; }
.overlay.open { display: flex; }
.panel { background: var(--panel); width: 100%; max-height: 82vh; border-radius: 16px 16px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
.panel-head { display: flex; gap: 14px; margin-bottom: 12px; }
.panel-head img { width: 72px; height: 100px; object-fit: cover; border-radius: 6px; background: var(--cover-ph); }
.bk-meta { font-size: 13px; color: var(--muted); line-height: 1.7; }
.panel-btns { display: flex; gap: 10px; margin-bottom: 12px; }
.panel-btns button { flex: 1; padding: 10px 0; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--text); font-size: 15px; font-family: inherit; }
.panel-btns button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.tabs { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.tabs span.on { color: var(--text); font-weight: 600; }
.tabs .sort { margin-left: auto; }
.panel-list { overflow-y: auto; flex: 1; }
.anno-item { background: var(--card); border-radius: 9px; padding: 10px 12px; margin-bottom: 9px; }
.anno-quote { font-size: 13px; color: var(--quote); border-left: 3px solid var(--border); padding-left: 8px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.anno-sub { font-size: 12px; color: var(--faint); display: flex; gap: 10px; }
.anno-root-empty { padding: 3px 0 1px; color: var(--faint); font-size: 11px; }
.mark-item { display: block; width: 100%; padding: 13px 4px; border: 0; border-bottom: 1px solid var(--border-soft); background: transparent; color: inherit; text-align: left; font-family: inherit; }
.mark-excerpt { font-size: 14px; line-height: 1.65; }
.mark-sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 11px; }
.who-human { color: var(--human-deep); } .who-ai { color: var(--ai); }
.toc-item { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
.toc-item.cur span:first-child { color: var(--accent); font-weight: 700; }
.toc-chars { color: var(--faint); font-size: 12px; }
.empty-tip { text-align: center; color: var(--faint); font-size: 13px; padding: 30px 0; }

/* ── 阅读器 ── */
.reader { position: fixed; inset: 0; width: 100%; height: 100dvh; min-height: -webkit-fill-available; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; z-index: 30; overscroll-behavior: none; visibility: hidden; opacity: 0; pointer-events: none; }
.reader.open { visibility: visible; opacity: 1; pointer-events: auto; }
.reader-top { position: relative; flex: 0 0 auto; min-height: calc(76px + var(--reading-top-safe)); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: var(--reading-top-safe) 15px 0; font-size: 14px; color: var(--muted); }
.reader-page-bookmark { position: absolute; top: var(--reading-top-safe); right: 20px; width: 14px; height: 24px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); pointer-events: none; }
.reader-page-bookmark[hidden] { display: none; }
.r-back { width: 44px; height: 44px; padding: 0; border: 0; display: grid; place-items: center; background: transparent; color: inherit; cursor: pointer; }
.r-back svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.r-title { height: 44px; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.reader-viewport { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 8px 22px; position: relative; touch-action: pan-y; }
.reader-flow, .reader-flow * { -webkit-user-select: text; user-select: text; }
:root.paint-select .reader-flow, :root.paint-select .reader-flow * { -webkit-touch-callout: none; }
::highlight(books-paint) { background-color: color-mix(in srgb, var(--human) 30%, transparent); }
.reader-flow { height: 100%; column-gap: 44px; column-fill: auto; font-size: 17px; line-height: 1.9; text-align: justify; transition: transform .26s cubic-bezier(.22,.72,.16,1); will-change: transform; }
.reader-flow.no-transition { transition: none; }
.reader-flow p { margin-bottom: 0.9em; text-indent: 2em; }
.reader-flow p.is-title { text-indent: 0; font-weight: 700; font-size: 1.12em; }
.reader-foot { text-align: center; font-size: 12px; color: var(--faint); padding: 6px 0 max(10px, env(safe-area-inset-bottom)); }
.seg { border-radius: 2px; }
.hl-human { box-shadow: inset 0 -2px rgba(233, 96, 155, .55); }
.hl-ai { box-shadow: inset 0 -2px rgba(74, 113, 181, .5); }
.hl-human.has-note { box-shadow: none; background: rgba(233, 96, 155, .16); }
.hl-ai.has-note { box-shadow: none; background: rgba(74, 113, 181, .14); }
:root[data-theme="night"] .hl-human.has-note { background: rgba(233, 96, 155, .26); }
:root[data-theme="night"] .hl-ai.has-note { background: rgba(111, 146, 204, .26); }
.hl-preview { background: rgba(240, 180, 41, .3); }
.seg.flash { background: rgba(240, 180, 41, .45); }
.bub { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 2px; vertical-align: super; }
.bub.by-human { background: var(--human); } .bub.by-ai { background: var(--ai); }

/* ── 划线后的轻操作条 ── */
.selection-tools { position: fixed; left: var(--books-selection-left, 50%); top: var(--books-selection-top, 16px); max-width: calc(100% - 16px); z-index: 9; display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid rgba(255,255,255,.82); border-radius: 999px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 14px 34px var(--shadow-deep); backdrop-filter: blur(20px) saturate(1.08); -webkit-backdrop-filter: blur(20px) saturate(1.08); opacity: 0; pointer-events: none; transform: translate(-50%, 12px) scale(.96); transition: opacity .16s ease, transform .2s cubic-bezier(.22,.72,.16,1); }
.selection-tools.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
.selection-tools button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-family: inherit; font-size: 13px; white-space: nowrap; }
.selection-tools .primary { background: var(--accent); color: var(--accent-text); }
:root[data-theme="night"] .selection-tools { border-color: rgba(255,255,255,.07); background: rgba(28,28,27,.96); }

/* ── 阅读中心菜单：点页面中间后逐层展开 ── */
.rbar { position: absolute; right: 18px; bottom: calc(44px + env(safe-area-inset-bottom)); width: min(268px, calc(100% - 48px)); display: grid; gap: 6px; opacity: 0; pointer-events: none; transform: translateY(18px) scale(.97); transform-origin: 78% 100%; transition: opacity .16s ease, transform .24s cubic-bezier(.22,.72,.16,1); z-index: 6; }
.reader.bar-open .rbar { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.rbar > button { min-height: 46px; padding: 0 16px; border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; gap: 14px; background: color-mix(in srgb, var(--border-soft) 94%, var(--text)); color: var(--text); box-shadow: 0 6px 18px var(--shadow); backdrop-filter: blur(28px) saturate(1.12); -webkit-backdrop-filter: blur(28px) saturate(1.12); font-family: inherit; font-size: 14px; font-weight: 500; text-align: left; opacity: 0; transform: translateY(10px); transition: opacity .16s ease, transform .26s cubic-bezier(.22,.72,.16,1), background .12s ease; }
.reader.bar-open .rbar > button { opacity: 1; transform: none; }
.reader.bar-open .rbar > button:nth-child(2) { transition-delay: .025s; }
.reader.bar-open .rbar > button:nth-child(3) { transition-delay: .05s; }
.rbar > button:active { transform: scale(.985); background: var(--border-soft); }
.rbar > button.reader-menu-primary { position: relative; isolation: isolate; overflow: hidden; }
.reader-menu-primary::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--reading-progress, 0%); background: color-mix(in srgb, var(--text) 14%, transparent); z-index: -1; pointer-events: none; }
.reader-menu-label { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.reader-menu-progress { font-size: 13px; font-weight: 500; opacity: .78; }
.reader-menu-icon { width: 21px; height: 21px; flex: 0 0 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.reader-menu-meta { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.reader-quick-actions { display: flex; justify-content: flex-end; padding-top: 2px; opacity: 0; transform: translateY(10px) scale(.9); transform-origin: 90% 50%; transition: opacity .16s ease, transform .28s cubic-bezier(.2,.88,.22,1.2); }
.reader.bar-open .reader-quick-actions { opacity: 1; transform: none; transition-delay: .075s; }
.r-mark { width: 46px; height: 46px; padding: 0; border: 1px solid rgba(255,255,255,.86); border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--border-soft) 94%, var(--text)); box-shadow: 0 6px 18px var(--shadow); backdrop-filter: blur(28px) saturate(1.12); -webkit-backdrop-filter: blur(28px) saturate(1.12); transition: transform .16s cubic-bezier(.2,.88,.22,1.2), background .18s ease, box-shadow .18s ease; }
.r-mark:active { transform: scale(.89); }
.r-mark.on { background: var(--accent); box-shadow: 0 6px 18px var(--shadow); }
.r-mark-icon { grid-area: 1 / 1; width: 24px; height: 24px; transition: opacity .15s ease, transform .22s cubic-bezier(.2,.88,.22,1.2); }
.r-mark-icon.on { opacity: 0; transform: scale(.72); }
.r-mark.on .r-mark-icon.off { opacity: 0; transform: scale(.72); }
.r-mark.on .r-mark-icon.on { opacity: 1; transform: scale(1); }
.r-mark.pulse { animation: bookmark-pop .34s cubic-bezier(.2,.88,.22,1.25); }
@keyframes bookmark-pop { 0% { transform: scale(1); } 42% { transform: scale(.82); } 72% { transform: scale(1.08); } 100% { transform: scale(1); } }
:root[data-theme="night"] .r-mark.on { background: rgba(148,128,140,.90); }
@media (min-width: 900px) {
  .reader-top, .reader-viewport, .reader-foot { width: min(860px, 100%); margin-left: auto; margin-right: auto; }
  .rbar { right: max(28px, calc((100vw - 860px) / 2)); }
}

/* ── 阅读设置：主题、字面与翻页 ── */
#sheet-set { max-height: 72vh; padding: 8px 20px calc(18px + env(safe-area-inset-bottom)); }
.settings-grabber { width: 36px; height: 4px; margin: 0 auto 3px; border-radius: 999px; background: var(--border); }
.settings-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; }
.settings-head h2 { font-size: 17px; line-height: 1; letter-spacing: -.025em; font-weight: 650; }
.settings-close { width: 42px; height: 42px; margin-right: -10px; border: 0; display: grid; place-items: center; background: transparent; color: var(--muted); }
.settings-close svg { width: 19px; height: 19px; }
.settings-section { padding: 12px 0 13px; border-top: 1px solid var(--border-soft); }
.settings-section:first-of-type { border-top: 0; }
.settings-label { margin-bottom: 7px; color: var(--muted); font-size: 11px; letter-spacing: .02em; }
.theme-grid { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); }
.theme-grid::after { content: ''; position: absolute; left: 0; bottom: 0; width: 33.333333%; height: 1px; background: linear-gradient(var(--accent), var(--accent)) center / 42px 1px no-repeat; transform: translateX(var(--theme-position, 0%)); transition: transform .24s cubic-bezier(.22,.72,.16,1); pointer-events: none; }

.page-mode::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 2); border-radius: 7px; background: var(--card); box-shadow: 0 1px 3px var(--shadow); transform: translateX(var(--page-mode-position, 0%)); transition: transform .22s cubic-bezier(.22,.72,.16,1); }

<main class="shelf loading-hidden" id="shelf">
